<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | Student Management Portal</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <header>
        <h1>Student Management Portal</h1>
        <p>Create Your Student Account</p>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="register.html">Register</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="attendance.html">Attendance</a></li>
            <li><a href="assignment.html">Assignments</a></li>
            <li><a href="study-material.html">Study Material</a></li>
            <li><a href="timetable.html">Timetable</a></li>
            <li><a href="notice.html">Notice Board</a></li>
            <li><a href="profile.html">Profile</a></li>
        </ul>
    </nav>

    <main>
        <section class="register-box">
            <h2>Student Registration</h2>

            <form action="#" method="post">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required />

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required />

                <label for="mobile">Mobile Number</label>
                <input type="tel" id="mobile" name="mobile" required />

                <label for="course">Course</label>
                <select id="course" name="course" required>
                    <option value="">Select Course</option>
                    <option>B.Tech Information Technology</option>
                    <option>B.Tech Computer Engineering</option>
                    <option>B.Tech CE</option>
                    <option>B.Tech Mechanical</option>
                </select>

                <label for="year">Academic Year</label>
                <select id="year" name="year" required>
                    <option value="">Select Year</option>
                    <option>1st Year</option>
                    <option>2nd Year</option>
                    <option>3rd Year</option>
                    <option>4th Year</option>
                </select>

                <label>Gender</label>

                <div class="gender">
                    <input type="radio" id="male" name="gender" />
                    <label for="male">Male</label>

                    <input type="radio" id="female" name="gender" />
                    <label for="female">Female</label>

                    <input type="radio" id="other" name="gender" />
                    <label for="other">Other</label>
                </div>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" required />

                <label for="confirm">Confirm Password</label>
                <input type="password" id="confirm" name="confirm" required />

                <label class="terms">
                    <input type="checkbox" required />
                    I agree to the Terms & Conditions
                </label>

                <button type="submit">Register</button>
            </form>

            <p class="login-link">
                Already have an account?
                <a href="login.html">Login</a>
            </p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Student Management Portal | CHARUSAT</p>
    </footer>
</body>

</html>
