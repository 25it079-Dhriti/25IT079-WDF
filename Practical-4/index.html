<!DOCTYPE html>
<html>
<head>
    <title>JavaScript DOM Practical</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Notification -->
    <div id="notification">
        🔔 Welcome to my website!
        <button onclick="closeNotification()">X</button>
    </div>


    <!-- Header -->
    <header>

        <h1>My Website</h1>

        <!-- Hamburger Button -->
        <button class="menu-btn" onclick="showMenu()">☰</button>

        <!-- Menu -->
        <div id="menu">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>

    </header>


    <div class="container">

        <!-- Dark Mode -->
        <button onclick="darkMode()">🌙 Dark Mode</button>


        <!-- FAQ -->
        <h2>Frequently Asked Questions</h2>

        <button class="faq-btn" onclick="showAnswer()">
            What is JavaScript?
        </button>

        <div id="answer">
            JavaScript is a programming language used to make websites
            interactive.
        </div>


        <!-- Modal -->
        <h2>Modal Popup</h2>

        <button onclick="openModal()">
            Open Popup
        </button>

        <div id="modal">

            <h3>Hello!</h3>

            <p>This is a simple modal popup.</p>

            <button onclick="closeModal()">
                Close
            </button>

        </div>


        <!-- Image Slider -->
        <h2>Image Slider</h2>

        <div class="slider">

            <img id="sliderImage"
                 src="https://picsum.photos/id/1015/400/250">

            <br>

            <button onclick="previousImage()">
                Previous
            </button>

            <button onclick="nextImage()">
                Next
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
